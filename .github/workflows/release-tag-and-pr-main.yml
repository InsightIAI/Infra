name: Release tag and PR to main

on:
  pull_request:
    types: [closed]
    branches:
      - release

jobs:
  create-tag-and-pr-to-main:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Create release tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.merge_commit_sha;

            const now = new Date();
            const stamp = now.toISOString().replace(/[-:TZ.]/g, "").slice(0, 14);
            const tag = `release-${stamp}-r${context.runNumber}-a${context.runAttempt}`;

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha,
            });

            core.info(`Created tag ${tag} at ${sha}`);

      - name: Create PR release to main if missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "main";
            const head = `${owner}:release`;

            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head,
            });

            if (openPulls.length > 0) {
              core.info(`Open PR already exists: #${openPulls[0].number}`);
              return;
            }

            const { data: created } = await github.rest.pulls.create({
              owner,
              repo,
              title: "chore: promote release to main",
              head: "release",
              base: "main",
              body: "PR creada automaticamente al hacer merge a release.",
            });

            core.info(`Created PR #${created.number}`);
